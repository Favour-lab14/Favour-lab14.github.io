<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Favour Ozuruoha's Data Analyst Portfolio showcasing Excel, SQL and Power BI skills.">

  <title>Favour Ozuruoha | Data Analyst</title>

  <style>
    :root {
      --navy: #14213d;
      --blue: #2563eb;
      --light: #f5f7fb;
      --white: #ffffff;
      --text: #344054;
      --muted: #667085;
      --border: #e4e7ec;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      text-decoration: none;
    }

    .container {
      width: min(1080px, 90%);
      margin: auto;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--navy);
      font-size: 1.15rem;
      font-weight: 800;
    }

    nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      list-style: none;
    }

    nav a {
      color: var(--text);
      font-size: 0.92rem;
    }

    nav a:hover,
    .project-link:hover {
      color: var(--blue);
    }

    .hero {
      background: var(--white);
      padding: 90px 0;
    }

    .hero-content {
      max-width: 760px;
    }

    .eyebrow {
      color: var(--blue);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      color: var(--navy);
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.15;
      margin: 16px 0;
    }

    .hero p,
    .section-intro {
      color: var(--muted);
      max-width: 700px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--blue);
      color: var(--white);
    }

    .btn-secondary {
      background: var(--white);
      color: var(--navy);
      border: 1px solid var(--border);
    }

    section {
      padding: 70px 0;
    }

    .section-title {
      color: var(--navy);
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .section-intro {
      margin-bottom: 28px;
    }

    .about-card,
    .skill-card,
    .project-card,
    .contact-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 25px;
    }

    .about-card p + p {
      margin-top: 14px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 28px;
    }

    .skill-icon {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .skill-card h3,
    .project-card h3 {
      color: var(--navy);
      margin-bottom: 8px;
    }

    .skill-card p,
    .project-card p {
      color: var(--muted);
    }

    .projects {
      background: #edf2f8;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .tag {
      display: inline-block;
      background: #eaf1ff;
      color: #1d4ed8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin: 14px 5px 12px 0;
    }

    .project-link {
      display: inline-block;
      color: var(--blue);
      font-weight: 700;
      margin-top: 8px;
    }

    .contact-card {
      text-align: center;
      padding: 40px 25px;
    }

    .contact-card p {
      color: var(--muted);
      max-width: 650px;
      margin: 10px auto;
    }

    footer {
      background: var(--navy);
      color: #dbe4f0;
      text-align: center;
      padding: 24px 0;
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 15px 0;
      }

      nav ul {
        gap: 12px 18px;
      }

      .hero {
        padding: 65px 0;
      }

      .skills-grid,
      .projects-grid {
        grid-template-columns: 1fr;
      }

      section {
        padding: 50px 0;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav class="container">
      <a class="logo" href="#home">FO. Portfolio</a>

      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="container hero-content">
        <span class="eyebrow">Aspiring Data Analyst</span>

        <h1>Favour Ozuruoha</h1>

        <p>

          transform raw data into meaningful insights. My current
          technical focus includes Excel,
